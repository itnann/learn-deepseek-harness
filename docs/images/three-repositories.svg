<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, sans-serif">
  <title>三份本地仓库的证据边界</title>
  <desc>DeepSeek Harness 提供完整核心源码，Learn Claude Code 提供教学复刻，Claude Code 官方公开仓库提供插件、配置与产品变化；三者能支持的结论强度不同。</desc>
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17365f"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="500" rx="12" fill="#f8fafc"/>
  <rect width="960" height="54" rx="12" fill="url(#head)"/>
  <rect y="44" width="960" height="10" fill="url(#head)"/>
  <text x="480" y="35" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">三份仓库不是三套同等完整的产品源码</text>

  <rect x="35" y="82" width="280" height="250" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="175" y="112" text-anchor="middle" fill="#1e3a8a" font-size="15" font-weight="700">DeepSeek Harness</text>
  <text x="175" y="134" text-anchor="middle" fill="#475569" font-size="11">完整产品核心源码</text>
  <line x1="60" y1="148" x2="290" y2="148" stroke="#bfdbfe"/>
  <text x="58" y="176" fill="#334155" font-size="12">✓ Agent Loop 与 Inbox</text>
  <text x="58" y="202" fill="#334155" font-size="12">✓ Session / surface / fork</text>
  <text x="58" y="228" fill="#334155" font-size="12">✓ Tool Runtime 与审批</text>
  <text x="58" y="254" fill="#334155" font-size="12">✓ Cordis 插件装配</text>
  <text x="58" y="280" fill="#334155" font-size="12">✓ 实现、测试、配置可互证</text>
  <rect x="72" y="296" width="206" height="25" rx="12" fill="#dbeafe"/>
  <text x="175" y="313" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="700">可以下“源码事实”结论</text>

  <rect x="340" y="82" width="280" height="250" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="480" y="112" text-anchor="middle" fill="#9a3412" font-size="15" font-weight="700">Learn Claude Code</text>
  <text x="480" y="134" text-anchor="middle" fill="#475569" font-size="11">可运行的教学复刻</text>
  <line x1="365" y1="148" x2="595" y2="148" stroke="#fed7aa"/>
  <text x="363" y="176" fill="#334155" font-size="12">✓ 最小 while loop</text>
  <text x="363" y="202" fill="#334155" font-size="12">✓ 20 章渐进式机制</text>
  <text x="363" y="228" fill="#334155" font-size="12">✓ Python 代码便于入门</text>
  <text x="363" y="254" fill="#334155" font-size="12">△ “深入 CC”是二手说明</text>
  <text x="363" y="280" fill="#334155" font-size="12">✗ 不是 Anthropic 官方实现</text>
  <rect x="377" y="296" width="206" height="25" rx="12" fill="#ffedd5"/>
  <text x="480" y="313" text-anchor="middle" fill="#9a3412" font-size="11" font-weight="700">用于“教学类比”</text>

  <rect x="645" y="82" width="280" height="250" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="785" y="112" text-anchor="middle" fill="#5b21b6" font-size="15" font-weight="700">Claude Code 官方仓库</text>
  <text x="785" y="134" text-anchor="middle" fill="#475569" font-size="11">官方公开产品表面</text>
  <line x1="670" y1="148" x2="900" y2="148" stroke="#ddd6fe"/>
  <text x="668" y="176" fill="#334155" font-size="12">✓ plugins / agents / skills</text>
  <text x="668" y="202" fill="#334155" font-size="12">✓ hooks 与 settings 示例</text>
  <text x="668" y="228" fill="#334155" font-size="12">✓ CHANGELOG 与发布信息</text>
  <text x="668" y="254" fill="#334155" font-size="12">✗ 无核心 Agent Loop 源码</text>
  <text x="668" y="280" fill="#334155" font-size="12">✗ 无会话与调度器实现</text>
  <rect x="682" y="296" width="206" height="25" rx="12" fill="#ede9fe"/>
  <text x="785" y="313" text-anchor="middle" fill="#5b21b6" font-size="11" font-weight="700">可以下“公开事实”结论</text>

  <line x1="175" y1="348" x2="175" y2="379" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="348" x2="480" y2="379" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="785" y1="348" x2="785" y2="379" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="90" y="384" width="780" height="78" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="480" y="410" text-anchor="middle" fill="#065f46" font-size="14" font-weight="700">可靠比较区</text>
  <text x="480" y="434" text-anchor="middle" fill="#047857" font-size="12">共同概念可以横向解释；内部算法只有 DeepSeek 能逐行确认</text>
  <text x="480" y="453" text-anchor="middle" fill="#64748b" font-size="11">证据不足时写“未知”，不从产品行为反推私有实现</text>
</svg>
