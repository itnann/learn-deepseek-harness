<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 610" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, sans-serif">
  <title>DeepSeek Harness 工具运行时管线</title>
  <desc>单次工具调用从模型 schema、参数快照、前置策略、审批、guard、around execute、工具 body、输出校验、后置策略到持久化结果；多个调用按并发安全性分组，但结果按模型顺序提交。</desc>
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17365f"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1040" height="610" rx="12" fill="#f8fafc"/>
  <rect width="1040" height="54" rx="12" fill="url(#head)"/>
  <rect y="44" width="1040" height="10" fill="url(#head)"/>
  <text x="520" y="35" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Tool Runtime：从模型意图到可重放行动结果</text>

  <text x="35" y="86" fill="#1e3a8a" font-size="13" font-weight="700">单次调用管线</text>

  <rect x="30" y="105" width="130" height="74" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.7"/>
  <text x="95" y="130" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="700">模型 Tool Call</text>
  <text x="95" y="150" text-anchor="middle" fill="#475569" font-size="9">name + JSON args</text>
  <text x="95" y="165" text-anchor="middle" fill="#475569" font-size="9">来自可见 schema</text>
  <line x1="160" y1="142" x2="192" y2="142" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="195" y="105" width="130" height="74" rx="9" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="260" y="130" text-anchor="middle" fill="#334155" font-size="11" font-weight="700">准备 Execution</text>
  <text x="260" y="150" text-anchor="middle" fill="#475569" font-size="9">快照 + 冻结参数</text>
  <text x="260" y="165" text-anchor="middle" fill="#475569" font-size="9">token + cancel signal</text>
  <line x1="325" y1="142" x2="357" y2="142" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="360" y="90" width="155" height="104" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.7"/>
  <text x="438" y="116" text-anchor="middle" fill="#5b21b6" font-size="11" font-weight="700">Pre Policy</text>
  <text x="438" y="137" text-anchor="middle" fill="#6d28d9" font-size="9">tools/pre-execute</text>
  <text x="438" y="154" text-anchor="middle" fill="#6d28d9" font-size="9">allow / deny / ask</text>
  <text x="438" y="171" text-anchor="middle" fill="#6d28d9" font-size="9">Approval + Guards</text>
  <line x1="515" y1="142" x2="547" y2="142" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="550" y="90" width="155" height="104" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="1.7"/>
  <text x="628" y="116" text-anchor="middle" fill="#9a3412" font-size="11" font-weight="700">Dispatch</text>
  <text x="628" y="137" text-anchor="middle" fill="#c2410c" font-size="9">tools/execute wrappers</text>
  <text x="628" y="154" text-anchor="middle" fill="#c2410c" font-size="9">timeout / retry / metrics</text>
  <text x="628" y="171" text-anchor="middle" fill="#c2410c" font-size="9">tool.execute()</text>
  <line x1="705" y1="142" x2="737" y2="142" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="740" y="90" width="155" height="104" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.7"/>
  <text x="818" y="116" text-anchor="middle" fill="#5b21b6" font-size="11" font-weight="700">Post Policy</text>
  <text x="818" y="137" text-anchor="middle" fill="#6d28d9" font-size="9">输出 schema + render</text>
  <text x="818" y="154" text-anchor="middle" fill="#6d28d9" font-size="9">tools/post-execute</text>
  <text x="818" y="171" text-anchor="middle" fill="#6d28d9" font-size="9">accept / replace / block</text>
  <line x1="895" y1="142" x2="927" y2="142" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="930" y="105" width="80" height="74" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.7"/>
  <text x="970" y="130" text-anchor="middle" fill="#065f46" font-size="10" font-weight="700">Session</text>
  <text x="970" y="150" text-anchor="middle" fill="#047857" font-size="9">tool/result</text>
  <text x="970" y="165" text-anchor="middle" fill="#047857" font-size="9">durable</text>

  <rect x="360" y="215" width="535" height="43" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="628" y="234" text-anchor="middle" fill="#5b21b6" font-size="10" font-weight="700">插件扩展点不改 Agent Loop：pre / around / post waterfall</text>
  <text x="628" y="250" text-anchor="middle" fill="#64748b" font-size="9">忘记 next() 会截断下游；deny 和错误仍会归一化成模型可见结果</text>

  <text x="35" y="304" fill="#9a3412" font-size="13" font-weight="700">同一 Assistant Message 中的多调用调度</text>
  <rect x="30" y="322" width="980" height="210" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="55" y="352" fill="#475569" font-size="10">模型顺序</text>
  <rect x="130" y="334" width="145" height="38" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="202" y="358" text-anchor="middle" fill="#1e40af" font-size="10">1. read A  [parallel]</text>
  <rect x="288" y="334" width="145" height="38" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="360" y="358" text-anchor="middle" fill="#1e40af" font-size="10">2. glob  [parallel]</text>
  <rect x="446" y="334" width="145" height="38" rx="7" fill="#ffedd5" stroke="#fb923c"/>
  <text x="518" y="358" text-anchor="middle" fill="#9a3412" font-size="10">3. rm tmp  [exclusive]</text>
  <rect x="604" y="334" width="145" height="38" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="676" y="358" text-anchor="middle" fill="#1e40af" font-size="10">4. read B  [parallel]</text>

  <text x="55" y="412" fill="#475569" font-size="10">执行分组</text>
  <rect x="130" y="390" width="303" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="281" y="417" text-anchor="middle" fill="#1e40af" font-size="10" font-weight="700">rolling pool：1 与 2 可以重叠</text>
  <line x1="433" y1="412" x2="444" y2="412" stroke="#475569" marker-end="url(#arrow)"/>
  <rect x="446" y="390" width="145" height="44" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="518" y="417" text-anchor="middle" fill="#9a3412" font-size="10" font-weight="700">屏障：单独执行</text>
  <line x1="591" y1="412" x2="602" y2="412" stroke="#475569" marker-end="url(#arrow)"/>
  <rect x="604" y="390" width="145" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="676" y="417" text-anchor="middle" fill="#1e40af" font-size="10" font-weight="700">下一 parallel 组</text>

  <text x="55" y="474" fill="#475569" font-size="10">结果提交</text>
  <rect x="130" y="452" width="620" height="44" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="440" y="471" text-anchor="middle" fill="#065f46" font-size="10" font-weight="700">即使 2 比 1 先完成，也按 1 → 2 → 3 → 4 写入 tool/result</text>
  <text x="440" y="488" text-anchor="middle" fill="#047857" font-size="9">取消时为未启动调用补 ABORTED_BEFORE_DISPATCH，保持 call/result 配对</text>

  <rect x="95" y="555" width="850" height="35" rx="9" fill="#f1f5f9"/>
  <text x="520" y="577" text-anchor="middle" fill="#334155" font-size="11">Policy 决定“能否尝试” · Approval 决定“人是否授权” · Sandbox 决定“实际能做到哪里”</text>
</svg>
