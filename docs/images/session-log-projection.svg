<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 590" font-family="'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, sans-serif">
  <title>Session 事件日志到模型消息面的投影</title>
  <desc>完整 append-only 日志包含边界、消息、流式分块和工具事件；surface 只选择三类消息事件，并允许压缩摘要替换旧模型消息区间；模型、UI、恢复和审计从不同投影读取。</desc>
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17365f"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="980" height="590" rx="12" fill="#f8fafc"/>
  <rect width="980" height="54" rx="12" fill="url(#head)"/>
  <rect y="44" width="980" height="10" fill="url(#head)"/>
  <text x="490" y="35" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">完整事实不删除，模型消息面可以被替换</text>

  <text x="160" y="86" text-anchor="middle" fill="#065f46" font-size="14" font-weight="700">SessionEvent[]：完整事实</text>
  <rect x="35" y="100" width="250" height="360" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>

  <g font-size="11">
    <rect x="55" y="120" width="210" height="28" rx="5" fill="#d1fae5"/><text x="67" y="139" fill="#065f46">0  turn/start</text>
    <rect x="55" y="154" width="210" height="28" rx="5" fill="#bfdbfe"/><text x="67" y="173" fill="#1e3a8a">1  user/message  ●</text>
    <rect x="55" y="188" width="210" height="28" rx="5" fill="#e2e8f0"/><text x="67" y="207" fill="#475569">2  request/header</text>
    <rect x="55" y="222" width="210" height="28" rx="5" fill="#e2e8f0"/><text x="67" y="241" fill="#475569">3  assistant/chunk</text>
    <rect x="55" y="256" width="210" height="28" rx="5" fill="#bfdbfe"/><text x="67" y="275" fill="#1e3a8a">4  assistant/message  ●</text>
    <rect x="55" y="290" width="210" height="28" rx="5" fill="#ffedd5"/><text x="67" y="309" fill="#9a3412">5  tool/call</text>
    <rect x="55" y="324" width="210" height="28" rx="5" fill="#fed7aa"/><text x="67" y="343" fill="#9a3412">6  tool/result  ●</text>
    <rect x="55" y="358" width="210" height="28" rx="5" fill="#d1fae5"/><text x="67" y="377" fill="#065f46">7  step/end / turn/end</text>
    <rect x="55" y="392" width="210" height="28" rx="5" fill="#ede9fe"/><text x="67" y="411" fill="#5b21b6">8  compaction/summary</text>
    <rect x="55" y="426" width="210" height="28" rx="5" fill="#ddd6fe"/><text x="67" y="445" fill="#5b21b6">9  user/message replace ●</text>
  </g>
  <text x="160" y="480" text-anchor="middle" fill="#64748b" font-size="10">● 表示能进入模型 surface 的事件类型</text>

  <line x1="285" y1="260" x2="354" y2="260" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="320" y="246" text-anchor="middle" fill="#64748b" font-size="10">fold</text>

  <text x="490" y="86" text-anchor="middle" fill="#1e3a8a" font-size="14" font-weight="700">Surface：当前模型消息面</text>
  <rect x="355" y="100" width="270" height="360" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="375" y="129" fill="#475569" font-size="11">压缩前：</text>
  <rect x="375" y="142" width="230" height="40" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="490" y="167" text-anchor="middle" fill="#1e40af" font-size="11">[1 user, 4 assistant, 6 tool]</text>

  <line x1="490" y1="184" x2="490" y2="222" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="505" y="207" fill="#6d28d9" font-size="10">seq 9 replace 1..6</text>

  <text x="375" y="250" fill="#475569" font-size="11">压缩后：</text>
  <rect x="375" y="263" width="230" height="56" rx="7" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="490" y="286" text-anchor="middle" fill="#5b21b6" font-size="11" font-weight="700">[9 summary]</text>
  <text x="490" y="304" text-anchor="middle" fill="#6d28d9" font-size="10">旧节点仍在 log，只被遮蔽</text>

  <rect x="375" y="344" width="230" height="85" rx="7" fill="#fff" stroke="#cbd5e1"/>
  <text x="490" y="367" text-anchor="middle" fill="#334155" font-size="11" font-weight="700">deriveMessages()</text>
  <text x="395" y="390" fill="#64748b" font-size="10">user/message → user</text>
  <text x="395" y="407" fill="#64748b" font-size="10">assistant/message → assistant</text>
  <text x="395" y="424" fill="#64748b" font-size="10">tool/result → tool result</text>

  <line x1="625" y1="260" x2="694" y2="260" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>

  <text x="815" y="86" text-anchor="middle" fill="#1e3a8a" font-size="14" font-weight="700">不同消费者</text>
  <rect x="695" y="100" width="250" height="360" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="720" y="128" width="200" height="58" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="820" y="151" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="700">下一次 LLM 请求</text>
  <text x="820" y="171" text-anchor="middle" fill="#475569" font-size="10">只读当前 surface</text>

  <rect x="720" y="208" width="200" height="58" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="820" y="231" text-anchor="middle" fill="#065f46" font-size="12" font-weight="700">UI / Transcript</text>
  <text x="820" y="251" text-anchor="middle" fill="#475569" font-size="10">可读流式 chunk 与原始消息</text>

  <rect x="720" y="288" width="200" height="58" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="820" y="311" text-anchor="middle" fill="#9a3412" font-size="12" font-weight="700">Resume / Fork / Repair</text>
  <text x="820" y="331" text-anchor="middle" fill="#475569" font-size="10">从完整事件前缀重放</text>

  <rect x="720" y="368" width="200" height="58" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="820" y="391" text-anchor="middle" fill="#5b21b6" font-size="12" font-weight="700">审计 / Telemetry</text>
  <text x="820" y="411" text-anchor="middle" fill="#475569" font-size="10">保留边界、来源与结果事实</text>

  <rect x="90" y="510" width="800" height="50" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="490" y="532" text-anchor="middle" fill="#065f46" font-size="12" font-weight="700">核心不变量：凡是进入模型请求的内容，都必须能从 Session 日志重建</text>
  <text x="490" y="550" text-anchor="middle" fill="#64748b" font-size="10">模型记忆可以变化，历史事实不能被悄悄改写</text>
</svg>
