<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">
  <title id="title">s04 Middleware 洋葱执行链</title><desc id="desc">工具调用依次进入日志、计时和策略中间件，最后到达 handler，结果再按相反顺序返回；策略可短路整条链。</desc>
  <defs><linearGradient id="h" x2="1"><stop stop-color="#4c1d95"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity=".14"/></filter><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7c3aed"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#059669"/></marker></defs>
  <rect width="920" height="500" rx="18" fill="#f8fafc"/><rect width="920" height="64" rx="18" fill="url(#h)"/><rect y="48" width="920" height="16" fill="url(#h)"/><circle cx="42" cy="32" r="19" fill="#fff" fill-opacity=".18"/><text x="42" y="38" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">04</text><text x="76" y="29" fill="#fff" font-size="19" font-weight="800">Middleware · 横切逻辑挂在执行链上</text><text x="76" y="49" fill="#ede9fe" font-size="11">进入顺序由外到内，结果返回由内到外；任何一层都可以短路</text>
  <text x="70" y="107" fill="#5b21b6" font-size="11" font-weight="800">REQUEST →</text><line x1="137" y1="103" x2="208" y2="103" stroke="#7c3aed" stroke-width="2" marker-end="url(#a)"/><text x="715" y="107" fill="#047857" font-size="11" font-weight="800">→ RESULT</text>
  <g filter="url(#s)"><rect x="112" y="126" width="696" height="224" rx="24" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="135" y="156" fill="#5b21b6" font-size="12" font-weight="800">Logging</text><text x="706" y="156" fill="#7c3aed" font-size="10">before / after</text><rect x="178" y="166" width="564" height="154" rx="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="199" y="194" fill="#1d4ed8" font-size="12" font-weight="800">Timing</text><text x="648" y="194" fill="#2563eb" font-size="10">start / elapsed</text><rect x="244" y="204" width="432" height="88" rx="17" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="265" y="231" fill="#c2410c" font-size="12" font-weight="800">Policy</text><text x="574" y="231" fill="#ea580c" font-size="10">allow or short-circuit</text><rect x="355" y="238" width="210" height="38" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="460" y="262" text-anchor="middle" fill="#065f46" font-size="12" font-weight="800">Tool Handler</text></g>
  <path d="M70 238H344" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#a)"/><text x="70" y="225" fill="#6d28d9" font-size="10">ToolCall 逐层进入</text><path d="M565 257H850" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#ag)"/><text x="725" y="245" fill="#047857" font-size="10">ToolResult 反向返回</text>
  <path d="M310 292V377H212" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><g transform="translate(86 374)"><rect width="252" height="56" rx="12" fill="#fff1f2" stroke="#fca5a5"/><text x="126" y="23" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="800">Policy 拒绝：不调用 next()</text><text x="126" y="42" text-anchor="middle" fill="#64748b" font-size="9">handler 永远不会被触达</text></g>
  <g transform="translate(386 374)"><rect width="448" height="56" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="20" y="24" fill="#334155" font-size="11" font-weight="800">组合顺序也是设计</text><text x="20" y="43" fill="#64748b" font-size="9">日志放在 Policy 外：拒绝也被记录；放在里面：只记录获准调用。</text></g>
  <text x="460" y="467" text-anchor="middle" fill="#334155" font-size="12" font-weight="700">本章新增：新横切能力只注册 Middleware，Agent Loop 与 Handler 都保持干净。</text>
</svg>
