<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">
  <title id="title">s07 Provider Boundary 稳定契约与可替换实现</title><desc id="desc">Session Core 只依赖 EventStore 契约，内存、本地文件和远端服务分别实现契约；替换实现不影响核心。</desc>
  <defs><linearGradient id="h" x2="1"><stop stop-color="#134e4a"/><stop offset="1" stop-color="#0f766e"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".12"/></filter><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
  <rect width="920" height="500" rx="18" fill="#f8fafc"/><rect width="920" height="64" rx="18" fill="url(#h)"/><rect y="48" width="920" height="16" fill="url(#h)"/><circle cx="42" cy="32" r="19" fill="#fff" fill-opacity=".18"/><text x="42" y="38" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">07</text><text x="76" y="29" fill="#fff" font-size="19" font-weight="800">Provider Boundary · 稳定契约隔开可变实现</text><text x="76" y="49" fill="#ccfbf1" font-size="11">核心描述“我需要什么”，Provider 决定“在哪里、怎样做到”</text>
  <g filter="url(#s)"><rect x="50" y="132" width="225" height="190" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="1.7"/><circle cx="162" cy="181" r="30" fill="#6366f1"/><path d="M147 181h30M162 166v30" stroke="#fff" stroke-width="3"/><text x="162" y="235" text-anchor="middle" fill="#312e81" font-size="15" font-weight="800">Session Core</text><text x="162" y="260" text-anchor="middle" fill="#475569" font-size="10">只调用 append / load</text><rect x="84" y="279" width="156" height="25" rx="8" fill="#fff"/><text x="162" y="296" text-anchor="middle" fill="#64748b" font-size="9">不认识文件、HTTP、数据库</text></g>
  <line x1="275" y1="227" x2="350" y2="227" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
  <g filter="url(#s)"><rect x="354" y="101" width="212" height="252" rx="18" fill="#fff" stroke="#0f766e" stroke-width="2"/><rect x="354" y="101" width="212" height="54" rx="18" fill="#f0fdfa"/><rect x="354" y="137" width="212" height="18" fill="#f0fdfa"/><text x="460" y="134" text-anchor="middle" fill="#115e59" font-size="14" font-weight="800">EventStore Contract</text><text x="381" y="184" fill="#64748b" font-size="10">稳定语义</text><rect x="381" y="200" width="158" height="44" rx="9" fill="#ecfdf5"/><text x="460" y="227" text-anchor="middle" fill="#047857" font-size="11" font-family="monospace">append(id, event)</text><rect x="381" y="255" width="158" height="44" rx="9" fill="#ecfdf5"/><text x="460" y="282" text-anchor="middle" fill="#047857" font-size="11" font-family="monospace">load(id) → events</text><text x="460" y="329" text-anchor="middle" fill="#64748b" font-size="9">顺序与持久化语义必须一致</text></g>
  <line x1="566" y1="227" x2="638" y2="227" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
  <g transform="translate(642 91)"><g filter="url(#s)"><rect width="230" height="78" rx="14" fill="#ecfdf5" stroke="#34d399"/><circle cx="31" cy="39" r="18" fill="#10b981"/><text x="31" y="44" text-anchor="middle" fill="#fff" font-size="10" font-weight="800">RAM</text><text x="61" y="34" fill="#065f46" font-size="12" font-weight="800">Memory Provider</text><text x="61" y="54" fill="#64748b" font-size="9">测试快，重启即丢失</text></g><g filter="url(#s)" transform="translate(0 95)"><rect width="230" height="78" rx="14" fill="#fffbeb" stroke="#fbbf24"/><circle cx="31" cy="39" r="18" fill="#f59e0b"/><text x="31" y="44" text-anchor="middle" fill="#fff" font-size="10" font-weight="800">FILE</text><text x="61" y="34" fill="#92400e" font-size="12" font-weight="800">Local Provider</text><text x="61" y="54" fill="#64748b" font-size="9">落盘、锁与迁移</text></g><g filter="url(#s)" transform="translate(0 190)"><rect width="230" height="78" rx="14" fill="#f5f3ff" stroke="#a78bfa"/><circle cx="31" cy="39" r="18" fill="#8b5cf6"/><text x="31" y="44" text-anchor="middle" fill="#fff" font-size="9" font-weight="800">HTTP</text><text x="61" y="34" fill="#5b21b6" font-size="12" font-weight="800">Remote Provider</text><text x="61" y="54" fill="#64748b" font-size="9">网络、重试与认证</text></g></g>
  <g transform="translate(50 392)"><rect width="822" height="62" rx="12" fill="#f0fdfa" stroke="#99f6e4"/><text x="22" y="26" fill="#115e59" font-size="12" font-weight="800">抽象时机</text><text x="100" y="26" fill="#475569" font-size="11">第二种实现真实出现时，再提取最小 Contract。</text><text x="22" y="46" fill="#64748b" font-size="10">接口保护业务不变量；网络重试、缓存和文件路径留在 Provider 内部。</text></g>
</svg>
