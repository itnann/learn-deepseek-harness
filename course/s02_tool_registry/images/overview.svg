<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">
  <title id="title">s02 Tool Registry 工具注册与分发</title><desc id="desc">Agent Loop 只把工具调用交给注册表，注册表按名称找到定义和执行函数；新增工具只需注册，不修改循环。</desc>
  <defs><linearGradient id="h" x2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#2563eb"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".12"/></filter><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7c3aed"/></marker></defs>
  <rect width="920" height="500" rx="18" fill="#f8fafc"/><rect width="920" height="64" rx="18" fill="url(#h)"/><rect y="48" width="920" height="16" fill="url(#h)"/><circle cx="42" cy="32" r="19" fill="#fff" fill-opacity=".18"/><text x="42" y="38" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">02</text><text x="76" y="29" fill="#fff" font-size="19" font-weight="800">Tool Registry · 增加能力，不修改循环</text><text x="76" y="49" fill="#dbeafe" font-size="11">稳定的调用协议，把工具数量与 Agent Loop 解耦</text>
  <g filter="url(#s)"><rect x="48" y="118" width="170" height="116" rx="14" fill="#eef2ff" stroke="#6366f1"/><text x="133" y="148" text-anchor="middle" fill="#312e81" font-size="14" font-weight="800">Agent Loop</text><rect x="68" y="164" width="130" height="44" rx="9" fill="#fff"/><text x="133" y="183" text-anchor="middle" fill="#475569" font-size="10">ToolCall</text><text x="133" y="199" text-anchor="middle" fill="#1d4ed8" font-size="11" font-weight="700">read_file(path)</text></g>
  <line x1="218" y1="176" x2="290" y2="176" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="254" y="164" text-anchor="middle" fill="#64748b" font-size="9">只调用 execute()</text>
  <g filter="url(#s)"><rect x="294" y="92" width="250" height="170" rx="16" fill="#fff" stroke="#7c3aed" stroke-width="1.7"/><rect x="294" y="92" width="250" height="40" rx="16" fill="#f5f3ff"/><rect x="294" y="118" width="250" height="14" fill="#f5f3ff"/><text x="419" y="118" text-anchor="middle" fill="#5b21b6" font-size="14" font-weight="800">Tool Registry</text><text x="319" y="157" fill="#64748b" font-size="10">按 name 查找</text><rect x="319" y="171" width="200" height="28" rx="7" fill="#ede9fe"/><text x="333" y="190" fill="#6d28d9" font-size="11" font-family="monospace">"read_file" → Tool</text><rect x="319" y="208" width="95" height="31" rx="7" fill="#eff6ff"/><text x="367" y="228" text-anchor="middle" fill="#1d4ed8" font-size="10">description</text><rect x="424" y="208" width="95" height="31" rx="7" fill="#fff7ed"/><text x="471" y="228" text-anchor="middle" fill="#c2410c" font-size="10">handler</text></g>
  <line x1="544" y1="176" x2="604" y2="176" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <g filter="url(#s)"><rect x="608" y="88" width="264" height="178" rx="16" fill="#fff" stroke="#cbd5e1"/><text x="630" y="117" fill="#334155" font-size="13" font-weight="800">可用工具池</text><g transform="translate(630 134)"><rect width="102" height="42" rx="9" fill="#eff6ff" stroke="#93c5fd"/><text x="51" y="26" text-anchor="middle" fill="#1d4ed8" font-size="11" font-weight="700">list_files</text><rect x="116" width="102" height="42" rx="9" fill="#fff7ed" stroke="#fdba74"/><text x="167" y="26" text-anchor="middle" fill="#c2410c" font-size="11" font-weight="700">read_file</text><rect y="54" width="102" height="42" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/><text x="51" y="80" text-anchor="middle" fill="#047857" font-size="11" font-weight="700">search</text><rect x="116" y="54" width="102" height="42" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/><text x="167" y="80" text-anchor="middle" fill="#64748b" font-size="11">new_tool</text></g></g>
  <path d="M740 266V333H419V265" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ap)"/><rect x="496" y="310" width="190" height="45" rx="22" fill="#f5f3ff" stroke="#c4b5fd"/><text x="591" y="330" text-anchor="middle" fill="#5b21b6" font-size="11" font-weight="800">新增工具 = 注册一个 Tool</text><text x="591" y="346" text-anchor="middle" fill="#64748b" font-size="9">循环完全不用改</text>
  <g transform="translate(70 383)"><rect width="780" height="64" rx="12" fill="#eff6ff" stroke="#bfdbfe"/><text x="22" y="27" fill="#1e3a8a" font-size="12" font-weight="800">稳定边界</text><text x="112" y="27" fill="#475569" font-size="11">ToolCall(name, arguments) → Registry → ToolResult</text><text x="22" y="48" fill="#64748b" font-size="10">字典不是重点；“未知工具、参数和结果怎样表达”这套协议才是重点。</text></g>
</svg>
