<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">
  <title id="title">s01 Agent Loop 最小闭环</title><desc id="desc">用户消息进入模型，模型发出工具调用，Harness 执行工具并把结果写回消息，再次交给模型，直到模型给出最终回答。</desc>
  <defs><linearGradient id="h" x2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#2563eb"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".12"/></filter><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><marker id="ao" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ea580c"/></marker></defs>
  <rect width="920" height="500" rx="18" fill="#f8fafc"/><rect width="920" height="64" rx="18" fill="url(#h)"/><rect y="48" width="920" height="16" fill="url(#h)"/>
  <circle cx="42" cy="32" r="19" fill="#fff" fill-opacity=".18"/><text x="42" y="38" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">01</text><text id="titleText" x="76" y="29" fill="#fff" font-size="19" font-weight="800">One Loop · 一次决定怎样变成连续行动</text><text x="76" y="49" fill="#dbeafe" font-size="11">观察 → 决策 → 行动 → 把结果送回去</text>
  <g filter="url(#s)"><rect x="48" y="112" width="150" height="86" rx="14" fill="#fff" stroke="#93c5fd"/><circle cx="78" cy="142" r="15" fill="#dbeafe"/><path d="M70 143h16M78 135v16" stroke="#2563eb" stroke-width="2"/><text x="101" y="144" fill="#1e3a8a" font-size="14" font-weight="700">用户目标</text><text x="73" y="174" fill="#64748b" font-size="11">“项目里有什么？”</text></g>
  <line x1="198" y1="155" x2="252" y2="155" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <g filter="url(#s)"><rect x="255" y="102" width="172" height="106" rx="14" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/><rect x="276" y="119" width="130" height="24" rx="7" fill="#eff6ff"/><text x="341" y="136" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="700">messages[]</text><text x="276" y="164" fill="#475569" font-size="11">user：项目里有什么？</text><text x="276" y="184" fill="#94a3b8" font-size="10">持续累积新的观察</text></g>
  <line x1="427" y1="155" x2="483" y2="155" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <g filter="url(#s)"><rect x="486" y="102" width="170" height="106" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/><circle cx="519" cy="135" r="17" fill="#6366f1"/><path d="M510 135h18M519 126v18" stroke="#fff" stroke-width="2"/><text x="545" y="139" fill="#312e81" font-size="15" font-weight="800">模型</text><text x="507" y="169" fill="#475569" font-size="11">决定：先调用 list_files</text><text x="507" y="188" fill="#64748b" font-size="10">模型提议，不直接执行</text></g>
  <line x1="656" y1="155" x2="712" y2="155" stroke="#ea580c" stroke-width="2.5" marker-end="url(#ao)"/>
  <g filter="url(#s)"><rect x="715" y="102" width="157" height="106" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/><rect x="736" y="119" width="115" height="25" rx="8" fill="#ffedd5"/><text x="794" y="136" text-anchor="middle" fill="#c2410c" font-size="12" font-weight="800">Harness</text><text x="736" y="169" fill="#9a3412" font-size="11">执行 list_files()</text><text x="736" y="188" fill="#64748b" font-size="10">获得真实世界结果</text></g>
  <path d="M794 208V282H341V210" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ao)"/><rect x="467" y="258" width="200" height="42" rx="21" fill="#fff" stroke="#fdba74"/><text x="567" y="276" text-anchor="middle" fill="#9a3412" font-size="11" font-weight="700">tool_result：README.md, app.py</text><text x="567" y="291" text-anchor="middle" fill="#64748b" font-size="9">结果不是日志，而是下一轮观察</text>
  <g transform="translate(92 338)"><rect width="736" height="76" rx="12" fill="#eff6ff" stroke="#bfdbfe"/><text x="24" y="29" fill="#1e3a8a" font-size="13" font-weight="800">循环何时停？</text><text x="24" y="53" fill="#475569" font-size="12">模型继续请求工具 → 再转一圈；模型返回 final → Harness 展示答案并结束。</text><rect x="592" y="18" width="120" height="38" rx="19" fill="#dcfce7" stroke="#86efac"/><text x="652" y="42" text-anchor="middle" fill="#166534" font-size="12" font-weight="800">final → 结束</text></g>
  <text x="460" y="461" text-anchor="middle" fill="#334155" font-size="12" font-weight="700">本章新增：把“人肉复制工具结果”的动作，变成一个可重复的控制循环。</text>
</svg>
