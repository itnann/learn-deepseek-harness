<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">
  <title id="title">s10 Composition Root 多入口共享核心</title><desc id="desc">CLI、Web 和测试 Adapter 把各自输入翻译为统一请求，交给同一个 AppCore；组合根集中装配 Registry、Policy 和 Store，避免入口配置漂移。</desc>
  <defs><linearGradient id="h" x2="1"><stop stop-color="#7c2d12"/><stop offset="1" stop-color="#ea580c"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".12"/></filter><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7c3aed"/></marker></defs>
  <rect width="920" height="520" rx="18" fill="#f8fafc"/><rect width="920" height="64" rx="18" fill="url(#h)"/><rect y="48" width="920" height="16" fill="url(#h)"/><circle cx="42" cy="32" r="19" fill="#fff" fill-opacity=".18"/><text x="42" y="38" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">10</text><text x="76" y="29" fill="#fff" font-size="19" font-weight="800">Composition Root · 多个产品入口，共用一个行为核心</text><text x="76" y="49" fill="#ffedd5" font-size="11">入口负责翻译，组合根负责装配，AppCore 负责行为</text>
  <text x="54" y="101" fill="#334155" font-size="11" font-weight="800">SURFACES</text><g transform="translate(48 116)"><g filter="url(#s)"><rect width="190" height="72" rx="13" fill="#111827"/><text x="25" y="30" fill="#86efac" font-size="13" font-family="monospace">&gt;_</text><text x="54" y="30" fill="#fff" font-size="12" font-weight="800">CLI Adapter</text><text x="25" y="51" fill="#cbd5e1" font-size="9">line → CoreRequest</text></g><g filter="url(#s)" transform="translate(0 89)"><rect width="190" height="72" rx="13" fill="#eff6ff" stroke="#60a5fa"/><circle cx="29" cy="29" r="14" fill="#3b82f6"/><text x="29" y="34" text-anchor="middle" fill="#fff" font-size="10" font-weight="800">{ }</text><text x="54" y="30" fill="#1e3a8a" font-size="12" font-weight="800">Web Adapter</text><text x="25" y="51" fill="#64748b" font-size="9">JSON → CoreRequest</text></g><g filter="url(#s)" transform="translate(0 178)"><rect width="190" height="72" rx="13" fill="#ecfdf5" stroke="#34d399"/><circle cx="29" cy="29" r="14" fill="#10b981"/><text x="29" y="34" text-anchor="middle" fill="#fff" font-size="10" font-weight="800">✓</text><text x="54" y="30" fill="#065f46" font-size="12" font-weight="800">Test Adapter</text><text x="25" y="51" fill="#64748b" font-size="9">object → CoreRequest</text></g></g>
  <path d="M238 152H339" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M238 241H339" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M238 330H339" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <g filter="url(#s)"><rect x="343" y="130" width="250" height="222" rx="20" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><circle cx="468" cy="193" r="38" fill="#6366f1"/><path d="M449 193h38M468 174v38" stroke="#fff" stroke-width="3"/><text x="468" y="254" text-anchor="middle" fill="#312e81" font-size="16" font-weight="800">AppCore</text><text x="468" y="278" text-anchor="middle" fill="#475569" font-size="10">同一 Agent Loop · 同一策略语义</text><rect x="377" y="298" width="182" height="31" rx="9" fill="#fff"/><text x="468" y="318" text-anchor="middle" fill="#4338ca" font-size="10" font-weight="700">run(CoreRequest)</text></g>
  <line x1="672" y1="241" x2="598" y2="241" stroke="#7c3aed" stroke-width="2.3" marker-end="url(#ap)"/><text x="635" y="228" text-anchor="middle" fill="#6d28d9" font-size="9">inject</text>
  <g filter="url(#s)"><rect x="676" y="102" width="196" height="278" rx="18" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/><rect x="676" y="102" width="196" height="48" rx="18" fill="#f5f3ff"/><rect x="676" y="134" width="196" height="16" fill="#f5f3ff"/><text x="774" y="132" text-anchor="middle" fill="#5b21b6" font-size="13" font-weight="800">Composition Root</text><text x="699" y="174" fill="#64748b" font-size="9">唯一知道具体实现的地方</text><g transform="translate(699 192)"><rect width="150" height="37" rx="9" fill="#eff6ff"/><text x="75" y="23" text-anchor="middle" fill="#1d4ed8" font-size="10" font-weight="700">Tool Registry</text><rect y="48" width="150" height="37" rx="9" fill="#fff1f2"/><text x="75" y="71" text-anchor="middle" fill="#be123c" font-size="10" font-weight="700">Policy</text><rect y="96" width="150" height="37" rx="9" fill="#ecfdf5"/><text x="75" y="119" text-anchor="middle" fill="#047857" font-size="10" font-weight="700">EventStore</text><rect y="144" width="150" height="37" rx="9" fill="#fff7ed"/><text x="75" y="167" text-anchor="middle" fill="#c2410c" font-size="10" font-weight="700">Lifecycle</text></g></g>
  <rect x="48" y="413" width="824" height="72" rx="13" fill="#fff" stroke="#cbd5e1"/><text x="72" y="442" fill="#334155" font-size="12" font-weight="800">避免配置漂移</text><text x="176" y="442" fill="#475569" font-size="11">CLI 和 Web 不各自创建一套“差不多”的 Harness。</text><text x="72" y="464" fill="#64748b" font-size="10">Surface 不能绕过 AppCore 直接访问 Tool Registry；否则入口重新承担了治理责任。</text>
</svg>
