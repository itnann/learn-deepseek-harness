<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">
  <title id="title">s08 Lifecycle 取消传播与逆序清理</title><desc id="desc">用户取消由 Lifecycle 向 Agent、后台工具和 Provider 传播，所有任务确认停止后，资源按后进先出的顺序清理，最终没有遗留任务。</desc>
  <defs><linearGradient id="h" x2="1"><stop stop-color="#134e4a"/><stop offset="1" stop-color="#0f766e"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".12"/></filter><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ef4444"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#059669"/></marker></defs>
  <rect width="920" height="520" rx="18" fill="#f8fafc"/><rect width="920" height="64" rx="18" fill="url(#h)"/><rect y="48" width="920" height="16" fill="url(#h)"/><circle cx="42" cy="32" r="19" fill="#fff" fill-opacity=".18"/><text x="42" y="38" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">08</text><text x="76" y="29" fill="#fff" font-size="19" font-weight="800">Lifecycle · 结束不是 break，而是完成清理</text><text x="76" y="49" fill="#ccfbf1" font-size="11">取消要向下传播；资源要按依赖关系逆序释放</text>
  <g filter="url(#s)"><rect x="48" y="112" width="164" height="80" rx="14" fill="#fff1f2" stroke="#fb7185"/><circle cx="78" cy="152" r="19" fill="#ef4444"/><rect x="72" y="142" width="12" height="20" rx="2" fill="#fff"/><text x="107" y="148" fill="#9f1239" font-size="12" font-weight="800">用户取消</text><text x="107" y="167" fill="#64748b" font-size="9">cancel()</text></g><line x1="212" y1="152" x2="285" y2="152" stroke="#ef4444" stroke-width="2.5" marker-end="url(#a)"/>
  <g filter="url(#s)"><rect x="289" y="96" width="210" height="112" rx="16" fill="#fff" stroke="#0f766e" stroke-width="1.8"/><text x="394" y="128" text-anchor="middle" fill="#115e59" font-size="14" font-weight="800">Lifecycle</text><rect x="315" y="145" width="158" height="36" rx="9" fill="#f0fdfa"/><text x="394" y="167" text-anchor="middle" fill="#0f766e" font-size="10" font-weight="700">cancelled.set()</text><text x="394" y="195" text-anchor="middle" fill="#64748b" font-size="9">统一拥有任务与 cleanup</text></g>
  <path d="M499 130H591" stroke="#ef4444" stroke-width="2" marker-end="url(#a)"/><path d="M499 152H591" stroke="#ef4444" stroke-width="2" marker-end="url(#a)"/><path d="M499 174H591" stroke="#ef4444" stroke-width="2" marker-end="url(#a)"/>
  <g transform="translate(595 87)"><g filter="url(#s)"><rect width="277" height="56" rx="12" fill="#eef2ff" stroke="#818cf8"/><text x="22" y="25" fill="#3730a3" font-size="11" font-weight="800">Agent Loop</text><text x="22" y="42" fill="#64748b" font-size="9">停止产生新的步骤</text></g><g filter="url(#s)" transform="translate(0 69)"><rect width="277" height="56" rx="12" fill="#fff7ed" stroke="#fb923c"/><text x="22" y="25" fill="#9a3412" font-size="11" font-weight="800">Background Tools</text><text x="22" y="42" fill="#64748b" font-size="9">观察信号并确认退出</text></g><g filter="url(#s)" transform="translate(0 138)"><rect width="277" height="56" rx="12" fill="#f5f3ff" stroke="#a78bfa"/><text x="22" y="25" fill="#5b21b6" font-size="11" font-weight="800">Provider / Stream</text><text x="22" y="42" fill="#64748b" font-size="9">停止请求，不再占用连接</text></g></g>
  <path d="M734 281V314H394V210" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ag)"/><text x="565" y="302" text-anchor="middle" fill="#047857" font-size="9">全部任务确认停止后，进入 finally</text>
  <g filter="url(#s)"><rect x="116" y="336" width="688" height="112" rx="16" fill="#fff" stroke="#cbd5e1"/><text x="144" y="365" fill="#334155" font-size="12" font-weight="800">Cleanup Stack · 后进先出</text><g transform="translate(144 384)"><rect width="174" height="38" rx="9" fill="#f5f3ff" stroke="#c4b5fd"/><text x="87" y="24" text-anchor="middle" fill="#6d28d9" font-size="10" font-weight="700">② close stream</text><line x1="174" y1="19" x2="224" y2="19" stroke="#059669" stroke-width="2" marker-end="url(#ag)"/><rect x="228" width="174" height="38" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/><text x="315" y="24" text-anchor="middle" fill="#047857" font-size="10" font-weight="700">① close provider</text><line x1="402" y1="19" x2="452" y2="19" stroke="#059669" stroke-width="2" marker-end="url(#ag)"/><rect x="456" width="62" height="38" rx="19" fill="#dcfce7"/><text x="487" y="24" text-anchor="middle" fill="#166534" font-size="10" font-weight="800">0 tasks</text></g></g>
  <text x="460" y="486" text-anchor="middle" fill="#334155" font-size="12" font-weight="700">创建资源的层必须同时定义：如何取消、等待多久、失败后怎样幂等清理。</text>
</svg>
