<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">
  <title id="title">s09 Subagent Scope 最小能力派生</title><desc id="desc">父 Agent 拥有完整能力集合，派生出的审查和测试子 Agent 只能获得父集合的子集；请求未授予的写入或部署能力会被运行时拒绝。</desc>
  <defs><linearGradient id="h" x2="1"><stop stop-color="#7c2d12"/><stop offset="1" stop-color="#ea580c"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".12"/></filter><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ea580c"/></marker></defs>
  <rect width="920" height="520" rx="18" fill="#f8fafc"/><rect width="920" height="64" rx="18" fill="url(#h)"/><rect y="48" width="920" height="16" fill="url(#h)"/><circle cx="42" cy="32" r="19" fill="#fff" fill-opacity=".18"/><text x="42" y="38" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">09</text><text x="76" y="29" fill="#fff" font-size="19" font-weight="800">Subagent &amp; Scope · 委派目标，也委派最小能力</text><text x="76" y="49" fill="#ffedd5" font-size="11">子 Scope 只能是父 Scope 的子集，不能凭空扩大</text>
  <g filter="url(#s)"><rect x="62" y="105" width="796" height="112" rx="17" fill="#fff7ed" stroke="#fb923c" stroke-width="1.7"/><circle cx="112" cy="161" r="30" fill="#ea580c"/><text x="112" y="167" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">PARENT</text><text x="160" y="140" fill="#9a3412" font-size="14" font-weight="800">父 Agent Scope</text><text x="160" y="162" fill="#64748b" font-size="10">开发任务需要较完整的能力集合</text><g transform="translate(160 178)"><rect width="92" height="25" rx="12" fill="#dbeafe"/><text x="46" y="17" text-anchor="middle" fill="#1d4ed8" font-size="9" font-weight="700">read_file</text><rect x="102" width="92" height="25" rx="12" fill="#dcfce7"/><text x="148" y="17" text-anchor="middle" fill="#047857" font-size="9" font-weight="700">search</text><rect x="204" width="92" height="25" rx="12" fill="#ffedd5"/><text x="250" y="17" text-anchor="middle" fill="#c2410c" font-size="9" font-weight="700">write_file</text><rect x="306" width="92" height="25" rx="12" fill="#fee2e2"/><text x="352" y="17" text-anchor="middle" fill="#b91c1c" font-size="9" font-weight="700">delete</text><rect x="408" width="92" height="25" rx="12" fill="#ede9fe"/><text x="454" y="17" text-anchor="middle" fill="#6d28d9" font-size="9" font-weight="700">deploy</text></g></g>
  <path d="M310 217V272H225" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#a)"/><path d="M610 217V272H695" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#a)"/><rect x="390" y="232" width="140" height="32" rx="16" fill="#fff" stroke="#fdba74"/><text x="460" y="252" text-anchor="middle" fill="#9a3412" font-size="10" font-weight="800">derive(allow=...)</text>
  <g filter="url(#s)"><rect x="62" y="276" width="353" height="145" rx="16" fill="#eef2ff" stroke="#818cf8"/><circle cx="101" cy="315" r="22" fill="#6366f1"/><text x="101" y="320" text-anchor="middle" fill="#fff" font-size="10" font-weight="800">REVIEW</text><text x="136" y="311" fill="#312e81" font-size="13" font-weight="800">Reviewer Scope</text><text x="136" y="329" fill="#64748b" font-size="9">只读审查：干净上下文 + 最小能力</text><g transform="translate(87 350)"><rect width="100" height="27" rx="13" fill="#dbeafe"/><text x="50" y="18" text-anchor="middle" fill="#1d4ed8" font-size="9" font-weight="700">✓ read_file</text><rect x="110" width="100" height="27" rx="13" fill="#dcfce7"/><text x="160" y="18" text-anchor="middle" fill="#047857" font-size="9" font-weight="700">✓ search</text><rect x="220" width="100" height="27" rx="13" fill="#f1f5f9"/><text x="270" y="18" text-anchor="middle" fill="#94a3b8" font-size="9">× write_file</text></g><text x="238" y="404" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="700">write_file → scope denied</text></g>
  <g filter="url(#s)"><rect x="505" y="276" width="353" height="145" rx="16" fill="#ecfdf5" stroke="#34d399"/><circle cx="544" cy="315" r="22" fill="#10b981"/><text x="544" y="320" text-anchor="middle" fill="#fff" font-size="10" font-weight="800">TEST</text><text x="579" y="311" fill="#065f46" font-size="13" font-weight="800">Test Scope</text><text x="579" y="329" fill="#64748b" font-size="9">测试任务：读取代码并运行测试</text><g transform="translate(530 350)"><rect width="100" height="27" rx="13" fill="#dbeafe"/><text x="50" y="18" text-anchor="middle" fill="#1d4ed8" font-size="9" font-weight="700">✓ read_file</text><rect x="110" width="100" height="27" rx="13" fill="#dcfce7"/><text x="160" y="18" text-anchor="middle" fill="#047857" font-size="9" font-weight="700">✓ run_tests</text><rect x="220" width="100" height="27" rx="13" fill="#f1f5f9"/><text x="270" y="18" text-anchor="middle" fill="#94a3b8" font-size="9">× deploy</text></g><text x="681" y="404" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="700">deploy → cannot gain capability</text></g>
  <rect x="62" y="454" width="796" height="40" rx="12" fill="#fff7ed" stroke="#fed7aa"/><text x="460" y="479" text-anchor="middle" fill="#9a3412" font-size="12" font-weight="800">Prompt 说“不要写”是行为引导；Runtime 检查 Scope 才是能力边界。</text>
  <rect x="670" y="178" width="92" height="25" rx="12" fill="#ccfbf1"/><text x="716" y="195" text-anchor="middle" fill="#0f766e" font-size="9" font-weight="700">run_tests</text>
</svg>
