<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">
  <title id="title">s11 通用组合与深度集成的设计取舍</title><desc id="desc">左侧通用组合型重视多实现、多入口与第三方扩展，右侧深度集成型重视强默认和连贯产品体验；下方天平说明选择取决于真实产品压力与团队成本。</desc>
  <defs><linearGradient id="h" x2="1"><stop stop-color="#4c1d95"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#c2410c"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".12"/></filter></defs>
  <rect width="920" height="540" rx="18" fill="#f8fafc"/><rect width="920" height="64" rx="18" fill="url(#h)"/><rect y="48" width="920" height="16" fill="url(#h)"/><circle cx="42" cy="32" r="19" fill="#fff" fill-opacity=".18"/><text x="42" y="38" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">11</text><text x="76" y="29" fill="#fff" font-size="19" font-weight="800">Design Tradeoffs · 比较优化目标，不比较抽象数量</text><text x="76" y="49" fill="#f5f3ff" font-size="11">通用组合与深度集成是两条方向，不是成熟度排行榜</text>
  <g filter="url(#s)"><rect x="48" y="94" width="382" height="286" rx="18" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.7"/><rect x="48" y="94" width="382" height="59" rx="18" fill="#ede9fe"/><rect x="48" y="135" width="382" height="18" fill="#ede9fe"/><circle cx="85" cy="123" r="18" fill="#7c3aed"/><path d="M77 123h16M85 115v16" stroke="#fff" stroke-width="2"/><text x="115" y="119" fill="#5b21b6" font-size="14" font-weight="800">通用组合型倾向</text><text x="115" y="137" fill="#6d28d9" font-size="9">DeepSeek Harness 作为案例</text><g transform="translate(75 176)"><text x="0" y="0" fill="#334155" font-size="10" font-weight="800">优化目标</text><text x="82" y="0" fill="#475569" font-size="10">多实现 · 多入口 · 可嵌入</text><rect y="21" width="328" height="39" rx="9" fill="#fff"/><text x="16" y="45" fill="#6d28d9" font-size="10" font-weight="700">Contract · Provider · Plugin · Scope</text><text x="0" y="90" fill="#047857" font-size="10" font-weight="800">收益</text><text x="54" y="90" fill="#475569" font-size="10">替换、组合、平台化</text><text x="0" y="120" fill="#dc2626" font-size="10" font-weight="800">成本</text><text x="54" y="120" fill="#475569" font-size="10">装配、兼容、调试链更长</text><rect y="148" width="328" height="47" rx="9" fill="#ede9fe"/><text x="164" y="168" text-anchor="middle" fill="#5b21b6" font-size="10" font-weight="800">适合：SDK / 平台 / 多租户 / 多产品形态</text><text x="164" y="185" text-anchor="middle" fill="#64748b" font-size="9">变化轴已经真实存在</text></g></g>
  <g filter="url(#s)"><rect x="490" y="94" width="382" height="286" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="1.7"/><rect x="490" y="94" width="382" height="59" rx="18" fill="#ffedd5"/><rect x="490" y="135" width="382" height="18" fill="#ffedd5"/><circle cx="527" cy="123" r="18" fill="#ea580c"/><path d="M519 116l16 14M535 116l-16 14" stroke="#fff" stroke-width="2"/><text x="557" y="119" fill="#9a3412" font-size="14" font-weight="800">深度集成型倾向</text><text x="557" y="137" fill="#c2410c" font-size="9">Claude Code 作为产品案例</text><g transform="translate(517 176)"><text x="0" y="0" fill="#334155" font-size="10" font-weight="800">优化目标</text><text x="82" y="0" fill="#475569" font-size="10">强默认 · 连贯体验 · 产品内聚</text><rect y="21" width="328" height="39" rx="9" fill="#fff"/><text x="16" y="45" fill="#c2410c" font-size="10" font-weight="700">统一工作流 · 稳定扩展面 · 产品判断集中</text><text x="0" y="90" fill="#047857" font-size="10" font-weight="800">收益</text><text x="54" y="90" fill="#475569" font-size="10">路径短、一致性强、认知负担低</text><text x="0" y="120" fill="#dc2626" font-size="10" font-weight="800">成本</text><text x="54" y="120" fill="#475569" font-size="10">第三方较难任意重组内部能力</text><rect y="148" width="328" height="47" rx="9" fill="#ffedd5"/><text x="164" y="168" text-anchor="middle" fill="#9a3412" font-size="10" font-weight="800">适合：边界明确的成熟垂直产品</text><text x="164" y="185" text-anchor="middle" fill="#64748b" font-size="9">体验一致性比任意组合更重要</text></g></g>
  <g transform="translate(48 409)"><rect width="824" height="88" rx="14" fill="#fff" stroke="#cbd5e1"/><line x1="412" y1="24" x2="412" y2="69" stroke="#64748b" stroke-width="3"/><path d="M320 35H504" stroke="#64748b" stroke-width="3"/><path d="M320 35L280 66H360Z" fill="#ede9fe" stroke="#8b5cf6"/><path d="M504 35L464 66H544Z" fill="#ffedd5" stroke="#fb923c"/><text x="320" y="82" text-anchor="middle" fill="#5b21b6" font-size="9" font-weight="700">真实变化压力</text><text x="504" y="82" text-anchor="middle" fill="#9a3412" font-size="9" font-weight="700">团队维护成本</text><text x="22" y="30" fill="#334155" font-size="12" font-weight="800">选择依据</text><text x="22" y="51" fill="#64748b" font-size="10">不是“谁更高级”</text><text x="620" y="30" fill="#334155" font-size="11" font-weight="800">先复现压力</text><text x="620" y="51" fill="#64748b" font-size="10">再引入解决它的层</text></g>
  <text x="460" y="523" text-anchor="middle" fill="#64748b" font-size="9">比较基于公开产品与设计表面，不推测 Claude Code 未公开的内部实现。</text>
</svg>
