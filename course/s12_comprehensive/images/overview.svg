<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">
  <title id="title">s12 Mini Harness 完整装配图</title><desc id="desc">产品入口通过 AppCore 进入小型 Agent Loop，循环读取 Context 与 Session View，工具调用经过 Scope、Middleware、Policy 与 Registry，事实写入 EventStore，Lifecycle 包围整个运行过程。</desc>
  <defs><linearGradient id="h" x2="1"><stop stop-color="#172554"/><stop offset=".55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#0f766e"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".12"/></filter><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker><marker id="ao" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ea580c"/></marker><marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#059669"/></marker></defs>
  <rect width="980" height="650" rx="18" fill="#f8fafc"/><rect width="980" height="66" rx="18" fill="url(#h)"/><rect y="50" width="980" height="16" fill="url(#h)"/><circle cx="42" cy="33" r="19" fill="#fff" fill-opacity=".18"/><text x="42" y="39" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">12</text><text x="76" y="30" fill="#fff" font-size="20" font-weight="800">Mini Harness · 机制很多，循环仍然只有一个</text><text x="76" y="51" fill="#dbeafe" font-size="11">复杂度长在边界上，不长回核心循环里</text>
  <g filter="url(#s)"><rect x="34" y="101" width="132" height="80" rx="14" fill="#111827"/><text x="55" y="132" fill="#86efac" font-size="14" font-family="monospace">&gt;_</text><text x="81" y="132" fill="#fff" font-size="12" font-weight="800">CLI</text><text x="100" y="154" text-anchor="middle" fill="#cbd5e1" font-size="9">Surface Adapter</text></g><line x1="166" y1="141" x2="210" y2="141" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <g filter="url(#s)"><rect x="214" y="91" width="180" height="100" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="1.7"/><text x="304" y="122" text-anchor="middle" fill="#312e81" font-size="14" font-weight="800">AppCore</text><text x="304" y="143" text-anchor="middle" fill="#64748b" font-size="9">稳定产品行为入口</text><rect x="242" y="157" width="124" height="22" rx="7" fill="#fff"/><text x="304" y="172" text-anchor="middle" fill="#4338ca" font-size="9">run(prompt)</text></g><line x1="394" y1="141" x2="438" y2="141" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <g filter="url(#s)"><rect x="442" y="88" width="504" height="221" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="694" y="117" text-anchor="middle" fill="#1e3a8a" font-size="14" font-weight="800">核心 Agent Loop</text><g transform="translate(469 137)"><rect width="103" height="55" rx="11" fill="#fff" stroke="#93c5fd"/><text x="51" y="24" text-anchor="middle" fill="#1d4ed8" font-size="10" font-weight="800">Model View</text><text x="51" y="41" text-anchor="middle" fill="#64748b" font-size="8">messages[]</text><line x1="103" y1="27" x2="142" y2="27" stroke="#64748b" stroke-width="1.7" marker-end="url(#a)"/><rect x="146" width="103" height="55" rx="11" fill="#eef2ff" stroke="#818cf8"/><text x="197" y="24" text-anchor="middle" fill="#4338ca" font-size="10" font-weight="800">Model</text><text x="197" y="41" text-anchor="middle" fill="#64748b" font-size="8">决定下一步</text><line x1="249" y1="27" x2="288" y2="27" stroke="#ea580c" stroke-width="1.7" marker-end="url(#ao)"/><rect x="292" width="156" height="55" rx="11" fill="#fff7ed" stroke="#fb923c"/><text x="370" y="24" text-anchor="middle" fill="#c2410c" font-size="10" font-weight="800">Tool Runtime</text><text x="370" y="41" text-anchor="middle" fill="#64748b" font-size="8">安全执行 ToolCall</text><path d="M370 55V105H51V56" fill="none" stroke="#ea580c" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#ao)"/><text x="210" y="93" text-anchor="middle" fill="#9a3412" font-size="8">ToolResult 回到 Session → 下一轮</text></g><rect x="469" y="258" width="448" height="31" rx="9" fill="#dbeafe"/><text x="693" y="278" text-anchor="middle" fill="#1e3a8a" font-size="10" font-weight="700">不变量：complete → execute → append result → repeat / final</text></g>
  <g filter="url(#s)"><rect x="34" y="229" width="360" height="118" rx="16" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/><text x="58" y="258" fill="#115e59" font-size="12" font-weight="800">Context Assembler</text><text x="58" y="278" fill="#64748b" font-size="9">身份 · 安全 · 工作区 · 当前能力</text><g transform="translate(58 296)"><rect width="75" height="25" rx="12" fill="#eef2ff"/><text x="37" y="17" text-anchor="middle" fill="#4338ca" font-size="8">identity</text><rect x="84" width="75" height="25" rx="12" fill="#fff1f2"/><text x="121" y="17" text-anchor="middle" fill="#be123c" font-size="8">safety</text><rect x="168" width="75" height="25" rx="12" fill="#ecfdf5"/><text x="205" y="17" text-anchor="middle" fill="#047857" font-size="8">workspace</text><rect x="252" width="75" height="25" rx="12" fill="#fff7ed"/><text x="289" y="17" text-anchor="middle" fill="#c2410c" font-size="8">scope</text></g></g><path d="M394 287H436" stroke="#059669" stroke-width="2" marker-end="url(#ag)"/>
  <g filter="url(#s)"><rect x="34" y="379" width="360" height="144" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="58" y="409" fill="#065f46" font-size="12" font-weight="800">Session + EventStore Provider</text><text x="58" y="429" fill="#64748b" font-size="9">完整事实持久化；模型只读 Projection</text><g transform="translate(58 447)"><rect width="96" height="48" rx="9" fill="#fff"/><text x="48" y="20" text-anchor="middle" fill="#047857" font-size="9" font-weight="700">append Event</text><text x="48" y="36" text-anchor="middle" fill="#94a3b8" font-size="8">事实源</text><line x1="96" y1="24" x2="126" y2="24" stroke="#059669" marker-end="url(#ag)"/><rect x="130" width="96" height="48" rx="9" fill="#fff"/><text x="178" y="20" text-anchor="middle" fill="#047857" font-size="9" font-weight="700">model_view</text><text x="178" y="36" text-anchor="middle" fill="#94a3b8" font-size="8">投影</text><line x1="226" y1="24" x2="256" y2="24" stroke="#059669" marker-end="url(#ag)"/><rect x="260" width="67" height="48" rx="9" fill="#dcfce7"/><text x="293" y="29" text-anchor="middle" fill="#166534" font-size="8" font-weight="700">Memory</text></g></g><path d="M394 430H429V244H441" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ag)"/>
  <g filter="url(#s)"><rect x="442" y="341" width="504" height="182" rx="18" fill="#fff" stroke="#ea580c" stroke-width="1.7"/><text x="466" y="371" fill="#9a3412" font-size="12" font-weight="800">Scoped Tool Runtime</text><text x="802" y="371" fill="#64748b" font-size="9">调用从左到右，结果反向返回</text><g transform="translate(466 391)"><rect width="97" height="57" rx="10" fill="#fff7ed" stroke="#fdba74"/><text x="48" y="24" text-anchor="middle" fill="#c2410c" font-size="9" font-weight="800">Logging</text><text x="48" y="41" text-anchor="middle" fill="#94a3b8" font-size="8">Middleware</text><line x1="97" y1="28" x2="123" y2="28" stroke="#64748b" marker-end="url(#a)"/><rect x="127" width="97" height="57" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/><text x="175" y="24" text-anchor="middle" fill="#6d28d9" font-size="9" font-weight="800">Scope</text><text x="175" y="41" text-anchor="middle" fill="#94a3b8" font-size="8">capability</text><line x1="224" y1="28" x2="250" y2="28" stroke="#64748b" marker-end="url(#a)"/><rect x="254" width="97" height="57" rx="10" fill="#fff1f2" stroke="#fda4af"/><text x="302" y="24" text-anchor="middle" fill="#be123c" font-size="9" font-weight="800">Policy</text><text x="302" y="41" text-anchor="middle" fill="#94a3b8" font-size="8">allow / deny</text><line x1="351" y1="28" x2="377" y2="28" stroke="#64748b" marker-end="url(#a)"/><rect x="381" width="97" height="57" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="429" y="24" text-anchor="middle" fill="#047857" font-size="9" font-weight="800">Registry</text><text x="429" y="41" text-anchor="middle" fill="#94a3b8" font-size="8">handler</text></g><rect x="466" y="466" width="456" height="35" rx="9" fill="#fff7ed"/><text x="694" y="488" text-anchor="middle" fill="#9a3412" font-size="10" font-weight="700">敏感路径被 Policy 短路，永远不触达 Handler</text></g>
  <g filter="url(#s)"><rect x="34" y="551" width="912" height="58" rx="14" fill="#f5f3ff" stroke="#a78bfa"/><circle cx="67" cy="580" r="17" fill="#7c3aed"/><text x="67" y="585" text-anchor="middle" fill="#fff" font-size="10" font-weight="800">L</text><text x="96" y="576" fill="#5b21b6" font-size="12" font-weight="800">Lifecycle 包围整个运行</text><text x="96" y="595" fill="#64748b" font-size="9">成功、失败或取消都进入 finally：先 flush Session，再关闭 Model Adapter，保证 0 个遗留任务。</text></g>
  <text x="490" y="634" text-anchor="middle" fill="#334155" font-size="11" font-weight="700">复杂度被分配到稳定边界；Agent Loop 仍只负责推进一轮又一轮。</text>
</svg>
