<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">
  <title id="title">s03 Policy Pipeline 三种策略决定</title><desc id="desc">工具调用先经过硬拒绝规则和风险规则，最终得到拒绝、询问或允许；只有允许的调用才进入工具注册表。</desc>
  <defs><linearGradient id="h" x2="1"><stop stop-color="#7f1d1d"/><stop offset="1" stop-color="#ea580c"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".12"/></filter><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
  <rect width="920" height="500" rx="18" fill="#f8fafc"/><rect width="920" height="64" rx="18" fill="url(#h)"/><rect y="48" width="920" height="16" fill="url(#h)"/><circle cx="42" cy="32" r="19" fill="#fff" fill-opacity=".18"/><text x="42" y="38" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">03</text><text x="76" y="29" fill="#fff" font-size="19" font-weight="800">Policy Pipeline · 会做，不等于这次应该做</text><text x="76" y="49" fill="#ffedd5" font-size="11">模型提出请求；代码拥有最终执行权</text>
  <g filter="url(#s)"><rect x="45" y="110" width="150" height="72" rx="13" fill="#eef2ff" stroke="#818cf8"/><text x="120" y="138" text-anchor="middle" fill="#3730a3" font-size="12" font-weight="800">ToolCall</text><text x="120" y="159" text-anchor="middle" fill="#475569" font-size="10">read / delete / secret</text></g><line x1="195" y1="146" x2="238" y2="146" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <g filter="url(#s)"><rect x="242" y="95" width="175" height="102" rx="14" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><circle cx="270" cy="124" r="13" fill="#ef4444"/><text x="270" y="129" text-anchor="middle" fill="#fff" font-size="12" font-weight="800">1</text><text x="292" y="129" fill="#991b1b" font-size="13" font-weight="800">硬拒绝</text><text x="262" y="155" fill="#7f1d1d" font-size="10">凭据、越界、永不允许</text><text x="262" y="176" fill="#ef4444" font-size="10" font-weight="700">命中 → DENY</text></g><line x1="417" y1="146" x2="460" y2="146" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <g filter="url(#s)"><rect x="464" y="95" width="175" height="102" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/><circle cx="492" cy="124" r="13" fill="#f59e0b"/><text x="492" y="129" text-anchor="middle" fill="#fff" font-size="12" font-weight="800">2</text><text x="514" y="129" fill="#92400e" font-size="13" font-weight="800">风险判断</text><text x="484" y="155" fill="#78350f" font-size="10">写入、删除、外部副作用</text><text x="484" y="176" fill="#d97706" font-size="10" font-weight="700">命中 → ASK</text></g><line x1="639" y1="146" x2="682" y2="146" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <g filter="url(#s)"><rect x="686" y="95" width="189" height="102" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><circle cx="714" cy="124" r="13" fill="#10b981"/><text x="714" y="129" text-anchor="middle" fill="#fff" font-size="12" font-weight="800">3</text><text x="736" y="129" fill="#065f46" font-size="13" font-weight="800">执行入口</text><text x="706" y="155" fill="#065f46" font-size="10">规则未命中或审批通过</text><text x="706" y="176" fill="#059669" font-size="10" font-weight="700">ALLOW → Registry</text></g>
  <path d="M329 197V248H179" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#a)"/><path d="M551 197V248H460" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"/><path d="M780 197V248H742" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#a)"/>
  <g transform="translate(74 250)"><rect width="210" height="94" rx="14" fill="#fff1f2" stroke="#fca5a5"/><text x="105" y="31" text-anchor="middle" fill="#991b1b" font-size="14" font-weight="800">DENY · 拒绝</text><text x="105" y="55" text-anchor="middle" fill="#7f1d1d" font-size="10">不执行 handler</text><text x="105" y="74" text-anchor="middle" fill="#64748b" font-size="10">原因作为 ToolResult 返回</text></g><g transform="translate(355 250)"><rect width="210" height="94" rx="14" fill="#fffbeb" stroke="#fcd34d"/><text x="105" y="31" text-anchor="middle" fill="#92400e" font-size="14" font-weight="800">ASK · 询问</text><text x="105" y="55" text-anchor="middle" fill="#78350f" font-size="10">暂停，交给 Approval</text><text x="105" y="74" text-anchor="middle" fill="#64748b" font-size="10">用户允许或拒绝</text></g><g transform="translate(636 250)"><rect width="210" height="94" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/><text x="105" y="31" text-anchor="middle" fill="#065f46" font-size="14" font-weight="800">ALLOW · 允许</text><text x="105" y="55" text-anchor="middle" fill="#065f46" font-size="10">进入 Tool Registry</text><text x="105" y="74" text-anchor="middle" fill="#64748b" font-size="10">执行并返回真实结果</text></g>
  <g transform="translate(74 382)"><rect width="772" height="68" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="22" y="28" fill="#334155" font-size="12" font-weight="800">三条边界</text><text x="105" y="28" fill="#475569" font-size="11">Policy 决定规则 · Approval 完成人类裁决 · Sandbox 提供系统级兜底</text><text x="22" y="50" fill="#64748b" font-size="10">Prompt 只能引导模型；真正的权限边界必须发生在执行代码中。</text></g>
</svg>
