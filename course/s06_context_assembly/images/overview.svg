<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">
  <title id="title">s06 Context Assembly 上下文组装</title><desc id="desc">身份、安全、工作区、Git 和技能等贡献者产生带来源与优先级的上下文块，组装器根据条件和预算选择后形成系统上下文。</desc>
  <defs><linearGradient id="h" x2="1"><stop stop-color="#064e3b"/><stop offset="1" stop-color="#0f766e"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".12"/></filter><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
  <rect width="920" height="520" rx="18" fill="#f8fafc"/><rect width="920" height="64" rx="18" fill="url(#h)"/><rect y="48" width="920" height="16" fill="url(#h)"/><circle cx="42" cy="32" r="19" fill="#fff" fill-opacity=".18"/><text x="42" y="38" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">06</text><text x="76" y="29" fill="#fff" font-size="19" font-weight="800">Context Assembly · Prompt 不是一篇写死的作文</text><text x="76" y="49" fill="#ccfbf1" font-size="11">每段信息都有来源、出现条件与预算优先级</text>
  <text x="58" y="99" fill="#334155" font-size="11" font-weight="800">CONTRIBUTORS</text>
  <g filter="url(#s)" transform="translate(48 116)"><g><rect width="190" height="48" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><circle cx="24" cy="24" r="13" fill="#6366f1"/><text x="24" y="28" text-anchor="middle" fill="#fff" font-size="9" font-weight="800">100</text><text x="47" y="21" fill="#312e81" font-size="11" font-weight="800">Identity</text><text x="47" y="37" fill="#64748b" font-size="9">始终出现</text></g><g transform="translate(0 60)"><rect width="190" height="48" rx="10" fill="#fff1f2" stroke="#fda4af"/><circle cx="24" cy="24" r="13" fill="#ef4444"/><text x="24" y="28" text-anchor="middle" fill="#fff" font-size="9" font-weight="800">95</text><text x="47" y="21" fill="#9f1239" font-size="11" font-weight="800">Safety</text><text x="47" y="37" fill="#64748b" font-size="9">不可被低价值信息挤掉</text></g><g transform="translate(0 120)"><rect width="190" height="48" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><circle cx="24" cy="24" r="13" fill="#10b981"/><text x="24" y="28" text-anchor="middle" fill="#fff" font-size="9" font-weight="800">80</text><text x="47" y="21" fill="#065f46" font-size="11" font-weight="800">Workspace</text><text x="47" y="37" fill="#64748b" font-size="9">当前运行环境</text></g><g transform="translate(0 180)"><rect width="190" height="48" rx="10" fill="#fffbeb" stroke="#fcd34d"/><circle cx="24" cy="24" r="13" fill="#f59e0b"/><text x="24" y="28" text-anchor="middle" fill="#fff" font-size="9" font-weight="800">60</text><text x="47" y="21" fill="#92400e" font-size="11" font-weight="800">Git Status</text><text x="47" y="37" fill="#64748b" font-size="9">needs_git 时才出现</text></g><g transform="translate(0 240)"><rect width="190" height="48" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/><circle cx="24" cy="24" r="13" fill="#8b5cf6"/><text x="24" y="28" text-anchor="middle" fill="#fff" font-size="9" font-weight="800">20</text><text x="47" y="21" fill="#5b21b6" font-size="11" font-weight="800">Skill Catalog</text><text x="47" y="37" fill="#64748b" font-size="9">预算不足时先舍弃</text></g></g>
  <path d="M238 260H319" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="279" y="247" text-anchor="middle" fill="#64748b" font-size="9">collect</text>
  <g filter="url(#s)"><rect x="323" y="125" width="235" height="278" rx="18" fill="#fff" stroke="#0f766e" stroke-width="1.7"/><text x="440" y="157" text-anchor="middle" fill="#115e59" font-size="14" font-weight="800">Context Assembler</text><line x1="348" y1="172" x2="533" y2="172" stroke="#ccfbf1" stroke-width="2"/><g transform="translate(348 192)"><rect width="185" height="42" rx="9" fill="#f0fdfa"/><text x="18" y="18" fill="#0f766e" font-size="10" font-weight="800">1 · 条件过滤</text><text x="18" y="33" fill="#64748b" font-size="9">本轮是否需要？</text><rect y="54" width="185" height="42" rx="9" fill="#f0fdfa"/><text x="18" y="72" fill="#0f766e" font-size="10" font-weight="800">2 · 优先级排序</text><text x="18" y="87" fill="#64748b" font-size="9">重要信息先占预算</text><rect y="108" width="185" height="42" rx="9" fill="#f0fdfa"/><text x="18" y="126" fill="#0f766e" font-size="10" font-weight="800">3 · 预算裁剪</text><text x="18" y="141" fill="#64748b" font-size="9">超出 token budget 就停</text><rect y="170" width="185" height="42" rx="9" fill="#134e4a"/><text x="92" y="196" text-anchor="middle" fill="#fff" font-size="11" font-weight="800">assemble()</text></g></g>
  <line x1="558" y1="260" x2="623" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <g filter="url(#s)"><rect x="627" y="112" width="245" height="300" rx="18" fill="#fff" stroke="#6366f1" stroke-width="1.7"/><text x="749" y="145" text-anchor="middle" fill="#312e81" font-size="14" font-weight="800">System Context</text><text x="650" y="169" fill="#64748b" font-size="9">本轮模型实际看见：</text><rect x="650" y="185" width="199" height="42" rx="9" fill="#eef2ff"/><text x="666" y="211" fill="#4338ca" font-size="10" font-weight="700">✓ Identity</text><rect x="650" y="237" width="199" height="42" rx="9" fill="#fff1f2"/><text x="666" y="263" fill="#be123c" font-size="10" font-weight="700">✓ Safety</text><rect x="650" y="289" width="199" height="42" rx="9" fill="#ecfdf5"/><text x="666" y="315" fill="#047857" font-size="10" font-weight="700">✓ Workspace</text><rect x="650" y="341" width="199" height="42" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 3"/><text x="666" y="367" fill="#94a3b8" font-size="10">× Skills（预算不足）</text></g>
  <rect x="48" y="448" width="824" height="42" rx="12" fill="#f0fdfa" stroke="#99f6e4"/><text x="460" y="474" text-anchor="middle" fill="#115e59" font-size="12" font-weight="800">Session 回答“过去发生了什么”；Context 回答“这一轮还应该知道什么”。</text>
</svg>
