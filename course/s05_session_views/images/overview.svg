<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif">
  <title id="title">s05 Session 事实与多种视图</title><desc id="desc">追加式事件日志保存完整事实，模型、界面和审计分别从同一日志生成不同投影视图，过滤不等于删除。</desc>
  <defs><linearGradient id="h" x2="1"><stop stop-color="#064e3b"/><stop offset="1" stop-color="#059669"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".12"/></filter><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#059669"/></marker></defs>
  <rect width="920" height="520" rx="18" fill="#f8fafc"/><rect width="920" height="64" rx="18" fill="url(#h)"/><rect y="48" width="920" height="16" fill="url(#h)"/><circle cx="42" cy="32" r="19" fill="#fff" fill-opacity=".18"/><text x="42" y="38" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">05</text><text x="76" y="29" fill="#fff" font-size="19" font-weight="800">Session · 事实只有一份，视图可以有很多份</text><text x="76" y="49" fill="#d1fae5" font-size="11">完整历史用于恢复；不同消费者只看自己需要的投影</text>
  <g filter="url(#s)"><rect x="48" y="94" width="292" height="332" rx="16" fill="#fff" stroke="#10b981" stroke-width="1.5"/><rect x="48" y="94" width="292" height="48" rx="16" fill="#ecfdf5"/><rect x="48" y="126" width="292" height="16" fill="#ecfdf5"/><text x="72" y="124" fill="#065f46" font-size="14" font-weight="800">Append-only Event Log</text><text x="276" y="124" fill="#059669" font-size="10">事实源</text>
  <g transform="translate(70 160)"><line x1="16" y1="0" x2="16" y2="228" stroke="#a7f3d0" stroke-width="3"/><g><circle cx="16" cy="17" r="8" fill="#2563eb"/><rect x="38" width="206" height="35" rx="8" fill="#eff6ff"/><text x="50" y="22" fill="#1d4ed8" font-size="10" font-weight="700">message · user</text></g><g transform="translate(0 47)"><circle cx="16" cy="17" r="8" fill="#6366f1"/><rect x="38" width="206" height="35" rx="8" fill="#eef2ff"/><text x="50" y="22" fill="#4338ca" font-size="10" font-weight="700">message · assistant</text></g><g transform="translate(0 94)"><circle cx="16" cy="17" r="8" fill="#f59e0b"/><rect x="38" width="206" height="35" rx="8" fill="#fffbeb"/><text x="50" y="22" fill="#92400e" font-size="10" font-weight="700">policy · allow</text></g><g transform="translate(0 141)"><circle cx="16" cy="17" r="8" fill="#94a3b8"/><rect x="38" width="206" height="35" rx="8" fill="#f1f5f9"/><text x="50" y="22" fill="#475569" font-size="10" font-weight="700">trace · latency 1.7ms</text></g><g transform="translate(0 188)"><circle cx="16" cy="17" r="8" fill="#ea580c"/><rect x="38" width="206" height="35" rx="8" fill="#fff7ed"/><text x="50" y="22" fill="#c2410c" font-size="10" font-weight="700">tool_result · README</text></g></g></g>
  <path d="M340 168H409" stroke="#059669" stroke-width="2" marker-end="url(#a)"/><path d="M340 260H409" stroke="#059669" stroke-width="2" marker-end="url(#a)"/><path d="M340 352H409" stroke="#059669" stroke-width="2" marker-end="url(#a)"/><text x="373" y="152" text-anchor="middle" fill="#047857" font-size="9">project()</text>
  <g filter="url(#s)" transform="translate(413 101)"><rect width="459" height="112" rx="14" fill="#eef2ff" stroke="#818cf8"/><circle cx="33" cy="33" r="17" fill="#6366f1"/><text x="33" y="38" text-anchor="middle" fill="#fff" font-size="11" font-weight="800">M</text><text x="62" y="31" fill="#312e81" font-size="13" font-weight="800">Model View</text><text x="62" y="49" fill="#64748b" font-size="9">只保留下一轮推理需要的消息</text><rect x="24" y="66" width="411" height="27" rx="7" fill="#fff"/><text x="38" y="84" fill="#475569" font-size="10">user → assistant → tool_result</text><text x="340" y="84" fill="#94a3b8" font-size="9">隐藏 policy / trace</text></g>
  <g filter="url(#s)" transform="translate(413 229)"><rect width="459" height="112" rx="14" fill="#fff7ed" stroke="#fb923c"/><circle cx="33" cy="33" r="17" fill="#ea580c"/><text x="33" y="38" text-anchor="middle" fill="#fff" font-size="11" font-weight="800">UI</text><text x="62" y="31" fill="#9a3412" font-size="13" font-weight="800">UI View</text><text x="62" y="49" fill="#64748b" font-size="9">把内部事件折叠成用户可读卡片</text><rect x="24" y="66" width="411" height="27" rx="7" fill="#fff"/><text x="38" y="84" fill="#475569" font-size="10">“工具 read_file 已完成：Harness 学习项目”</text></g>
  <g filter="url(#s)" transform="translate(413 357)"><rect width="459" height="70" rx="14" fill="#ecfdf5" stroke="#10b981"/><circle cx="33" cy="35" r="17" fill="#059669"/><text x="33" y="40" text-anchor="middle" fill="#fff" font-size="10" font-weight="800">ALL</text><text x="62" y="31" fill="#065f46" font-size="13" font-weight="800">Audit View</text><text x="62" y="50" fill="#64748b" font-size="9">完整回放：策略、耗时、工具结果一个都不丢</text></g>
  <rect x="48" y="454" width="824" height="40" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/><text x="460" y="479" text-anchor="middle" fill="#065f46" font-size="12" font-weight="800">过滤发生在 View，不发生在事实源：省上下文 ≠ 删除历史。</text>
</svg>
